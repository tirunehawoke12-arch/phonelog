name: Build from zip
on: [push, workflow_dispatch]
permissions: { contents: read, pages: write, id-token: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q phonelog.zip -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build APK
        working-directory: src/phonelog
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLog-apk
          path: src/phonelog/app/build/outputs/apk/debug/app-debug.apk
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q phonelog.zip -d src
          mkdir _site
          cp src/phonelog/app/src/main/assets/index.html _site/
          cp src/phonelog/web/manifest.webmanifest src/phonelog/web/sw.js src/phonelog/web/icon-*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
